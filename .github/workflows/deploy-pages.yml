name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        env:
          VITE_PARAMETER_PLOTTER_URL: https://sukoyaka-dopeness.github.io/e2r-parameter-plotter/
          VITE_ASHEN_CROWN_DATASET_EN_URL: ${{ vars.E2R_ASHEN_CROWN_DATASET_EN_URL }}
          VITE_ASHEN_CROWN_DATASET_JA_URL: ${{ vars.E2R_ASHEN_CROWN_DATASET_JA_URL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
